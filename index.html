<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceLinguist AI Agent</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        select { background: #334155; color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 16px; width: 100%; margin-bottom: 15px; }
        button { background: #2563eb; color: white; border: none; padding: 16px 32px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; transition: 0.2s; }
        button.recording { background: #dc2626; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        #output { background: #0f172a; padding: 15px; border-radius: 10px; margin-top: 20px; min-height: 120px; text-align: right; font-size: 18px; border: 1px solid #334155; line-height: 1.6; word-break: break-word; }
        .status { margin-top: 12px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>VoiceLinguist AI Agent</h2>
        
        <label for="langSelect" style="display:block; text-align:right; margin-bottom:5px; color:#cbd5e1;">اختر لغة التحدث:</label>
        <select id="langSelect">
            <option value="ar-SA">العربية (Saudi Arabia)</option>
            <option value="en-US">English (US)</option>
            <option value="ar-EG">العربية (مصر)</option>
            <option value="fr-FR">Français</option>
        </select>

        <button id="micBtn" onclick="toggleRecord()">🎤 اضغط للتحدث</button>
        <p class="status" id="statusText">جاهز للتسجيل...</p>
        
        <div id="output">النص المكتوب سيظهر هنا...</div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const output = document.getElementById('output');
        const statusText = document.getElementById('statusText');
        const langSelect = document.getElementById('langSelect');
        
        let recognition;
        let isRecording = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            statusText.innerText = 'متصفح الجوال هذا لا يدعم تحويل الصوت إلى نص. يرجى تجربة Google Chrome.';
            micBtn.disabled = true;
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.innerText = '⏹️ جاري الاستماع...';
                statusText.innerText = 'جاري الاستماع الآن، تحدث بصوت واضح...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = 0; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                output.innerText = transcript;
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                statusText.innerText = 'تنبيه: ' + event.error;
            };

            recognition.onend = () => {
                if (isRecording) {
                    try { recognition.start(); } catch(e){}
                } else {
                    micBtn.classList.remove('recording');
                    micBtn.innerText = '🎤 اضغط للتحدث';
                    statusText.innerText = 'تم إيقاف التسجيل.';
                }
            };
        }

        async function toggleRecord() {
            if (!recognition) return;

            if (!isRecording) {
                try {
                    // طلب إذن الميكروفون صراحة للجوال
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(track => track.stop());

                    // تحديد اللغة المختارة صراحة للجوال
                    recognition.lang = langSelect.value;
                    output.innerText = '';
                    recognition.start();
                } catch (err) {
                    alert('يرجى السماح باستخدام الميكروفون من إعدادات الجوال/المتصفح.');
                    statusText.innerText = 'تم رفض الإذن.';
                }
            } else {
                isRecording = false;
                recognition.stop();
            }
        }
    </script>
</body>
</html>
