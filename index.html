<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceLinguist AI Agent - الاستجابة السريعة</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 650px; margin: auto; }
        h1 { text-align: center; font-size: 22px; color: #38bdf8; margin-bottom: 20px; }
        
        .section { background: #1e293b; padding: 20px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #334155; }
        .section h2 { font-size: 18px; margin-top: 0; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .group { flex: 1; min-width: 140px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        
        select, textarea { width: 100%; background: #0f172a; color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 70px; }
        
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 8px; }
        button.recording { background: #dc2626; animation: pulse 1.5s infinite; }
        button.secondary { background: #059669; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .output-box { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 12px; min-height: 60px; border: 1px solid #334155; font-size: 15px; line-height: 1.5; word-break: break-word; color: #e2e8f0; }
        .status { font-size: 12px; color: #94a3b8; margin-top: 6px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VoiceLinguist AI Agent</h1>

        <!-- ================= القسم الأول: التفريغ الصوتي السريع ================= -->
        <div class="section">
            <h2>1️⃣ قسم تحويل الصوت إلى نص مكتوب</h2>
            <div class="controls">
                <div class="group">
                    <label>لغة التحدث:</label>
                    <select id="sttLang">
                        <option value="ar-SA">العربية (Saudi Arabia)</option>
                        <option value="ur-PK">اردو (Urdu)</option>
                        <option value="en-US">English (US)</option>
                        <option value="hi-IN">हिन्दी (Hindi)</option>
                        <option value="fr-FR">Français</option>
                        <option value="es-ES">Español</option>
                        <option value="de-DE">Deutsch</option>
                        <option value="zh-CN">中文 (Chinese)</option>
                    </select>
                </div>
            </div>
            <button id="sttBtn" onclick="toggleSTT()">🎤 ابدأ التسجيل الصوتي</button>
            <div class="status" id="sttStatus">جاهز...</div>
            <div class="output-box" id="sttOutput">النص المكتوب سيظهر هنا...</div>
        </div>

        <!-- ================= القسم الثاني: الترجمة السريعة ================= -->
        <div class="section">
            <h2>2️⃣ قسم الترجمة الفورية (كتابة + صوت + نطق)</h2>
            <div class="controls">
                <div class="group">
                    <label>من لغة:</label>
                    <select id="transSource">
                        <option value="ar">العربية</option>
                        <option value="ur">اردو (Urdu)</option>
                        <option value="en">English</option>
                        <option value="hi">हिन्दी</option>
                        <option value="fr">Français</option>
                        <option value="es">Español</option>
                    </select>
                </div>
                <div class="group">
                    <label>إلى لغة:</label>
                    <select id="transTarget">
                        <option value="en">English</option>
                        <option value="ar">العربية</option>
                        <option value="ur">اردو (Urdu)</option>
                        <option value="hi">हिन्दी</option>
                        <option value="fr">Français</option>
                        <option value="es">Español</option>
                    </select>
                </div>
            </div>

            <label>أدخل النص (كتابة يدوية) أو استخدم الصوت بالأسفل:</label>
            <textarea id="transInput" placeholder="اكتب هنا أو تحدث باستخدام زر الصوت..." oninput="doTranslation()"></textarea>
            
            <button id="transMicBtn" onclick="toggleTranslationVoice()">🎤 إدخال صوتي للترجمة</button>
            <div class="status" id="transStatus">جاهز للترجمة...</div>
            
            <label style="margin-top: 10px; display:block;">النتيجة المترجمة:</label>
            <div class="output-box" id="transOutput">الترجمة ستظهر هنا...</div>
            
            <button class="secondary" onclick="speakTranslation()">🔊 استماع للترجمة صوتياً</button>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        // تهيئة إذن الميكروفون عند فتح الصفحة مباشرة لمنع التأخير عند الضغط
        window.addEventListener('DOMContentLoaded', () => {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    stream.getTracks().forEach(t => t.stop());
                }).catch(() => {});
            }
        });

        // --- القسم الأول: STT سريع ---
        let sttRecognition;
        let isSttRunning = false;
        const sttBtn = document.getElementById('sttBtn');
        const sttOutput = document.getElementById('sttOutput');
        const sttStatus = document.getElementById('sttStatus');
        const sttLang = document.getElementById('sttLang');

        if (SpeechRecognition) {
            sttRecognition = new SpeechRecognition();
            sttRecognition.continuous = false;
            sttRecognition.interimResults = true;

            sttRecognition.onstart = () => {
                isSttRunning = true;
                sttBtn.classList.add('recording');
                sttBtn.innerText = '⏹️ جاري الاستماع الفوري...';
                sttStatus.innerText = 'تحدث الآن مباشرة...';
            };
            sttRecognition.onresult = (e) => {
                let text = '';
                for (let i = 0; i < e.results.length; i++) {
                    text += e.results[i][0].transcript;
                }
                sttOutput.innerText = text;
            };
            sttRecognition.onerror = (e) => { sttStatus.innerText = 'خطأ: ' + e.error; };
            sttRecognition.onend = () => {
                sttBtn.classList.remove('recording');
                sttBtn.innerText = '🎤 ابدأ التسجيل الصوتي';
                sttStatus.innerText = 'تم الانتهاء.';
                isSttRunning = false;
            };
        }

        function toggleSTT() {
            if (!sttRecognition) { alert('المتصفح لا يدعم الصوت'); return; }
            if (!isSttRunning) {
                sttRecognition.lang = sttLang.value;
                sttOutput.innerText = '';
                try { sttRecognition.start(); } catch(err){}
            } else {
                sttRecognition.stop();
            }
        }

        // --- القسم الثاني: الترجمة ---
        const transInput = document.getElementById('transInput');
        const transOutput = document.getElementById('transOutput');
        const transSource = document.getElementById('transSource');
        const transTarget = document.getElementById('transTarget');
        const transMicBtn = document.getElementById('transMicBtn');
        const transStatus = document.getElementById('transStatus');

        let transRecognition;
        let isTransVoiceRunning = false;

        if (SpeechRecognition) {
            transRecognition = new SpeechRecognition();
            transRecognition.continuous = false;
            transRecognition.interimResults = true;

            transRecognition.onstart = () => {
                isTransVoiceRunning = true;
                transMicBtn.classList.add('recording');
                transMicBtn.innerText = '⏹️ استماع فوري...';
                transStatus.innerText = 'تحدث الآن...';
            };
            transRecognition.onresult = async (e) => {
                let spokenText = '';
                for (let i = 0; i < e.results.length; i++) {
                    spokenText += e.results[i][0].transcript;
                }
                transInput.value = spokenText;
                await translateText(spokenText);
            };
            transRecognition.onerror = (e) => { transStatus.innerText = 'خطأ: ' + e.error; };
            transRecognition.onend = () => {
                transMicBtn.classList.remove('recording');
                transMicBtn.innerText = '🎤 إدخال صوتي للترجمة';
                transStatus.innerText = 'جاهز...';
                isTransVoiceRunning = false;
            };
        }

        function toggleTranslationVoice() {
            if (!transRecognition) { alert('المتصفح لا يدعم الصوت'); return; }
            if (!isTransVoiceRunning) {
                const langMap = { ar: 'ar-SA', ur: 'ur-PK', en: 'en-US', hi: 'hi-IN', fr: 'fr-FR', es: 'es-ES' };
                transRecognition.lang = langMap[transSource.value] || 'ar-SA';
                try { transRecognition.start(); } catch(err){}
            } else {
                transRecognition.stop();
            }
        }

        async function doTranslation() {
            const text = transInput.value.trim();
            if (!text) { transOutput.innerText = 'الترجمة ستظهر هنا...'; return; }
            await translateText(text);
        }

        async function translateText(text) {
            transOutput.innerText = 'جاري الترجمة...';
            try {
                const src = transSource.value;
                const tgt = transTarget.value;
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${tgt}`);
                const data = await res.json();
                if (data && data.responseData) {
                    transOutput.innerText = data.responseData.translatedText;
                } else {
                    transOutput.innerText = 'تعذر الحصول على الترجمة.';
                }
            } catch(err) {
                transOutput.innerText = 'خطأ في الاتصال.';
            }
        }

        function speakTranslation() {
            const textToSpeak = transOutput.innerText;
            if (!textToSpeak || textToSpeak.includes('الترجمة ستظهر') || textToSpeak.includes('جاري الترجمة')) {
                alert('لا يوجد ترجمة لنطقها حالياً.');
                return;
            }
            if (!('speechSynthesis' in window)) {
                alert('متصفحك لا يدعم خاصية النطق الصوتي.');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = transTarget.value === 'ar' ? 'ar-SA' : (transTarget.value === 'ur' ? 'ur-PK' : 'en-US');
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
